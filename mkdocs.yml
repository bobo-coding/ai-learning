site_name: Transformers from scratch
site_description: >-
  A hands-on curriculum that builds an LLM stack from the tokenizer up:
  architecture, pretraining, inference, fine-tuning, evaluation, quantization
  and GPU kernels -- all runnable on an Apple Silicon Mac, all tested.
site_url: https://bobo-coding.github.io/ai-learning/
repo_url: https://github.com/bobo-coding/ai-learning
repo_name: bobo-coding/ai-learning
edit_uri: ""

# `docs/` is generated by `python -m scripts.build_docs` -- see that module for
# what it rewrites and why. Do not edit docs/ by hand; edit lessons/.
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols
  - pymdownx.caret
  - pymdownx.tilde

plugins:
  - search

# The lessons are a sequence; the nav preserves that order.
nav:
  - Overview: index.md
  - "0 — Setup and ground rules": 00_setup.md
  - "1 — Tokenization": 01_tokenization.md
  - "2 — Attention": 02_attention.md
  - "3 — The transformer": 03_transformer.md
  - "4 — Pretraining": 04_pretraining.md
  - "5 — Inference": 05_inference.md
  - "6 — Supervised fine-tuning": 06_sft.md
  - "7 — Preference optimization": 07_dpo.md
  - "8 — RLVR with GRPO": 08_rlvr_grpo.md
  - "9 — Evaluation": 09_evaluation.md
  - "10 — Quantization": 10_quantization.md
  - "11 — LoRA and QLoRA": 11_lora.md
  - "12 — GPU kernels: Metal and CUDA": 12_gpu_kernels.md
  - "13 — Triton": 13_triton.md
  - Measured results: results.md

validation:
  # Catch a lesson link that build_docs failed to rewrite, rather than shipping
  # a 404. `mkdocs build --strict` then turns these into a failed CI job.
  links:
    absolute_links: ignore
    unrecognized_links: warn
    not_found: warn
  nav:
    omitted_files: warn
