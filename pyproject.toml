[project]
name = "ai-learning"
version = "0.1.0"
description = "A hands-on transformer curriculum: architecture, training, inference, fine-tuning, eval, quantization, and GPU kernels — runnable on an Apple Silicon Mac."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
# mkdocs is pinned below 2.0: upstream has announced that 2.0 removes the
# plugin and theming systems with no migration path.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[tool.setuptools.packages.find]
include = ["minigpt*", "tritonsim*", "kernels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
